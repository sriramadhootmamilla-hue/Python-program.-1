<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Registration System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaeef5;--surface:#fff;--ink:#14203b;--muted:#5b6784;--line:#d5dce9;
  --accent:#2447d6;--accent-ink:#fff;--chip:#e3e9fb;--chip-ink:#1c3aa8;
  --danger:#b3261e;--ok:#17703e;--field:#f7f9fd;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1424;--surface:#161e33;--ink:#e6ebf8;--muted:#98a4c3;--line:#2a3555;
    --accent:#7d98ff;--accent-ink:#0b1230;--chip:#223059;--chip-ink:#b9c8ff;
    --danger:#ff8a80;--ok:#6fd49a;--field:#101830;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1424;--surface:#161e33;--ink:#e6ebf8;--muted:#98a4c3;--line:#2a3555;
  --accent:#7d98ff;--accent-ink:#0b1230;--chip:#223059;--chip-ink:#b9c8ff;
  --danger:#ff8a80;--ok:#6fd49a;--field:#101830;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:400 16px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2{font-family:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;margin:0;line-height:1.1}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 48px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:24px}
h1{font-size:clamp(28px,4.6vw,44px);font-weight:700;letter-spacing:-.02em}
.sub{color:var(--muted);margin:6px 0 0;max-width:52ch}
.count{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:clamp(34px,6vw,56px);line-height:1;color:var(--accent);text-align:right}
.count small{display:block;font:500 14px "Public Sans",sans-serif;color:var(--muted);margin-top:4px}
.layout{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel h2{font-size:22px;margin-bottom:14px}
.editing{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
input[aria-invalid="true"]{border-color:var(--danger)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:3px 0 0}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
button{font:600 15px "Public Sans",sans-serif;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;min-height:44px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.small{min-height:36px;padding:6px 12px;font-size:14px}
button.danger{color:var(--danger);border-color:var(--danger)}
button.danger.armed{background:var(--danger);color:var(--surface)}
.tools{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.tools input{flex:1}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-weight:600;font-size:13px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
tr:last-child td{border-bottom:0}
.chip{display:inline-block;background:var(--chip);color:var(--chip-ink);font-weight:600;font-size:13px;border-radius:999px;padding:1px 9px;margin-right:8px}
.name{font-weight:600}
.dim{color:var(--muted);font-size:14px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:36px 12px;text-align:center;color:var(--muted)}
#status{min-height:24px;margin:12px 2px 0;font-weight:500}
#status.ok{color:var(--ok)}#status.bad{color:var(--danger)}
.note{background:var(--chip);color:var(--chip-ink);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.foot{margin-top:22px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Student Registration</h1>
      <p class="sub">Register students, find them by name or email, and keep their details up to date.</p>
    </div>
    <div class="count" aria-live="polite"><span id="total">0</span><small>students registered</small></div>
  </header>
  <div id="notice" class="note" hidden></div>
  <div class="layout">
    <section class="panel" id="formPanel" aria-labelledby="formTitle">
      <h2 id="formTitle">Register a student</h2>
      <form id="form" novalidate>
        <label for="fullName">Full name</label><input id="fullName" autocomplete="off">
        <p class="err" id="e-fullName"></p>
        <label for="email">Email</label><input id="email" type="email" autocomplete="off">
        <p class="err" id="e-email"></p>
        <label for="phone">Phone</label><input id="phone" type="tel" autocomplete="off">
        <label for="dob">Date of birth</label><input id="dob" type="date">
        <label for="program">Program</label><input id="program" autocomplete="off">
        <label for="yearLevel">Year level</label>
        <select id="yearLevel"><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option><option>5th Year</option></select>
        <label for="address">Address</label><input id="address" autocomplete="off">
        <div class="row">
          <button type="submit" class="primary" id="submitBtn">Register student</button>
          <button type="button" id="cancelBtn" hidden>Cancel</button>
        </div>
      </form>
      <div id="status" role="status"></div>
    </section>
    <section class="panel" aria-labelledby="listTitle">
      <h2 id="listTitle">Student roster</h2>
      <div class="tools"><input id="search" type="search" placeholder="Search by name or email" aria-label="Search by name or email"></div>
      <div class="scroll">
        <table>
          <thead><tr><th>Student</th><th>Program</th><th>Contact</th><th>Registered</th><th><span class="sr">Actions</span></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="foot">Data is saved in this browser only. IDs are never reused, even after a student is deleted.</p>
    </section>
  </div>
</div>
<script>
(function(){
  var KEY='srs.v1', EMAIL=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
  var FIELDS=['fullName','email','phone','dob','program','yearLevel','address'];
  var db={nextId:1,students:[]}, editId=null, armed=null, armTimer=null;
  var $=function(id){return document.getElementById(id)};

  function load(){
    var raw=null;
    try{raw=localStorage.getItem(KEY)}catch(e){return}
    if(!raw)return;
    try{
      var d=JSON.parse(raw);
      if(!d||!Array.isArray(d.students))throw new Error('shape');
      d.students.forEach(function(s){FIELDS.concat(['id','dateRegistered']).forEach(function(k){if(!(k in s))throw new Error('missing '+k)})});
      var top=d.students.reduce(function(m,s){return Math.max(m,s.id)},0);
      db={nextId:Math.max(parseInt(d.nextId)||1,top+1),students:d.students};
    }catch(e){
      var bak='srs.bak.'+Date.now();
      try{localStorage.setItem(bak,raw)}catch(x){}
      var n=$('notice');n.hidden=false;
      n.textContent='The saved data could not be read. A copy was kept under “'+bak+'” and a new empty roster was started.';
    }
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){say('Changes could not be saved in this browser.',true)}}

  function say(msg,bad){var s=$('status');s.textContent=msg;s.className=bad?'bad':'ok'}
  function setErr(f,msg){$('e-'+f).textContent=msg||'';$(f).setAttribute('aria-invalid',msg?'true':'false')}

  function validate(v,exclude){
    var ok=true;setErr('fullName');setErr('email');
    if(!v.fullName.trim()){setErr('fullName','Enter the student’s full name.');ok=false}
    if(!EMAIL.test(v.email)){setErr('email','Enter a valid email address, like name@school.edu.');ok=false}
    else if(db.students.some(function(s){return s.email.toLowerCase()===v.email.toLowerCase()&&s.id!==exclude})){setErr('email','This email is already registered.');ok=false}
    return ok;
  }
  function values(){var v={};FIELDS.forEach(function(f){v[f]=$(f).value.trim()});return v}

  function addStudent(v){
    var s={id:db.nextId,dateRegistered:new Date().toISOString()};
    FIELDS.forEach(function(f){s[f]=v[f]});
    db.nextId+=1;db.students.push(s);save();return s;
  }
  function updateStudent(id,v){
    var s=db.students.find(function(x){return x.id===id});
    if(!s)return false;
    FIELDS.forEach(function(f){s[f]=v[f]}); // id and dateRegistered are never touched
    save();return true;
  }
  function deleteStudent(id){
    var n=db.students.length;
    db.students=db.students.filter(function(s){return s.id!==id});
    if(db.students.length<n){save();return true}return false;
  }

  function resetForm(){
    $('form').reset();editId=null;FIELDS.forEach(function(f){setErr(f)});
    $('formTitle').textContent='Register a student';
    $('submitBtn').textContent='Register student';
    $('cancelBtn').hidden=true;$('formPanel').classList.remove('editing');
  }
  function startEdit(s){
    editId=s.id;
    FIELDS.forEach(function(f){$(f).value=s[f]});
    $('formTitle').textContent='Edit student #'+s.id;
    $('submitBtn').textContent='Save changes';
    $('cancelBtn').hidden=false;$('formPanel').classList.add('editing');
    say('');$('fullName').focus();
    $('formPanel').scrollIntoView({behavior:'smooth',block:'nearest'});
  }

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
  function render(){
    $('total').textContent=db.students.length;
    var q=$('search').value.trim().toLowerCase(), body=$('rows');
    body.textContent='';
    var list=db.students.filter(function(s){return !q||s.fullName.toLowerCase().indexOf(q)>-1||s.email.toLowerCase().indexOf(q)>-1});
    if(!list.length){
      var tr=el('tr'),td=el('td','empty',db.students.length?'No students match “'+$('search').value.trim()+'”.':'No students yet. Register the first student using the form.');
      td.colSpan=5;tr.appendChild(td);body.appendChild(tr);return;
    }
    list.forEach(function(s){
      var tr=el('tr');
      var c1=el('td');var l1=el('div');l1.appendChild(el('span','chip','#'+s.id));l1.appendChild(el('span','name',s.fullName));
      c1.appendChild(l1);c1.appendChild(el('div','dim',s.email));tr.appendChild(c1);
      var c2=el('td');c2.appendChild(el('div','',s.program||'Not set'));c2.appendChild(el('div','dim',s.yearLevel));tr.appendChild(c2);
      var c3=el('td');c3.appendChild(el('div','',s.phone||'No phone'));c3.appendChild(el('div','dim',s.address||'No address'));tr.appendChild(c3);
      var d=new Date(s.dateRegistered);
      tr.appendChild(el('td','dim',isNaN(d)?'Unknown':d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})));
      var c5=el('td'),a=el('div','acts');
      var eb=el('button','small','Edit');eb.type='button';eb.setAttribute('aria-label','Edit '+s.fullName);
      eb.onclick=function(){startEdit(s)};
      var db_=el('button','small danger',armed===s.id?'Confirm delete':'Delete');db_.type='button';
      if(armed===s.id)db_.classList.add('armed');
      db_.setAttribute('aria-label','Delete '+s.fullName);
      db_.onclick=function(){
        if(armed===s.id){
          clearTimeout(armTimer);armed=null;deleteStudent(s.id);
          if(editId===s.id)resetForm();
          say('Deleted '+s.fullName+'.');render();
        }else{
          armed=s.id;clearTimeout(armTimer);
          armTimer=setTimeout(function(){armed=null;render()},4000);render();
        }
      };
      a.appendChild(eb);a.appendChild(db_);c5.appendChild(a);tr.appendChild(c5);body.appendChild(tr);
    });
  }

  $('form').addEventListener('submit',function(ev){
    ev.preventDefault();
    var v=values();
    if(!validate(v,editId)){say('Fix the highlighted fields and try again.',true);return}
    if(editId!==null){
      updateStudent(editId,v);say('Saved changes to '+v.fullName+'.');resetForm();
    }else{
      var s=addStudent(v);say('Registered '+s.fullName+' with ID '+s.id+'.');resetForm();
    }
    render();
  });
  $('cancelBtn').onclick=function(){resetForm();say('')};
  $('search').addEventListener('input',render);

  load();render();
})();
</script>
</body>
</html>
